apiVersion: batch/v1
kind: Job
metadata:
  name: rynnbrain-contact-{{ORX_RUN}}
spec:
  activeDeadlineSeconds: 21600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "8"
              cpu: "64"
              memory: "512Gi"
            limits:
              nvidia.com/gpu: "8"
              cpu: "64"
              memory: "512Gi"
